name: CI

on:
  pull_request:
  push:
    branches:
      - product
      - feat/**

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit Tests
        run: go test ./internal/supamemory ./internal/sink

      - name: Chat Quality Gate
        run: go test ./internal/sink -run TestChatQualityGate50Cases -count=1

